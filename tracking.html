<!doctype html><html lang="sq"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gjurmo porosinë — ZemZem</title><meta name="description" content="Kontrollo statusin e porosisë ZemZem me numrin e porosisë dhe emailin."><meta name="robots" content="noindex,follow"><link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="assets/css/brand.css?v=4"><style>body{background:#f7f9f8}.track-wrap{max-width:760px;margin:50px auto;padding:0 18px}.track-card{background:#fff;border:1px solid #e1e8e4;border-radius:20px;padding:26px;box-shadow:0 18px 45px rgba(32,55,43,.08)}.track-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.track-grid label{display:grid;gap:6px;font-size:12px;font-weight:800}.track-grid input{min-height:46px;border:1px solid #dce5e0;border-radius:10px;padding:10px 12px}.track-actions{margin-top:14px}.track-result{margin-top:18px}.track-status{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.track-box{background:#f7faf8;border:1px solid #e4ebe7;border-radius:12px;padding:13px}.track-box span{display:block;font-size:10px;color:#738078}.track-box b{display:block;margin-top:4px}.track-note{margin-top:12px;color:#6d7972;font-size:12px}@media(max-width:650px){.track-grid,.track-status{grid-template-columns:1fr}}</style></head><body><header class="header"><div class="container"><div class="header-row compact"><a class="brand" href="index.html"><span class="brand-mark"></span><span>ZemZem</span></a><div class="header-actions"><a class="icon-btn" href="account.html">Llogaria</a></div></div></div></header><main class="track-wrap"><div class="track-card"><div class="eyebrow">ORDER TRACKING</div><h1>Gjurmo porosinë</h1><p>Shkruaj numrin e porosisë dhe emailin që ke përdorur gjatë blerjes.</p><form id="trackForm" class="track-grid"><label>Numri i porosisë<input id="trackOrder" required placeholder="ZZ-2026-..."></label><label>Email<input id="trackEmail" type="email" required placeholder="email@example.com"></label><div class="track-actions"><button class="btn btn-primary" type="submit">Kontrollo statusin</button></div></form><div id="trackResult" class="track-result" aria-live="polite"></div></div></main><script src="assets/js/branding.js?v=7"></script><script>(()=>{const f=document.getElementById('trackForm'),out=document.getElementById('trackResult'),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));f.addEventListener('submit',async e=>{e.preventDefault();out.innerHTML='<div class="track-note">Duke kontrolluar…</div>';try{const r=await fetch('https://ysvtrhizgcioyycwlkrk.supabase.co/functions/v1/order-track',{method:'POST',headers:{'Content-Type':'application/json',apikey:'sb_publishable_HosI5ns0isB0FyQHrGbXwA_9LKzaFMD'},body:JSON.stringify({order_number:document.getElementById('trackOrder').value,email:document.getElementById('trackEmail').value})});const d=await r.json();if(!r.ok)throw new Error('Porosia nuk u gjet. Kontrollo numrin dhe emailin.');const o=d.order;out.innerHTML='<div class="track-status"><div class="track-box"><span>POROSIA</span><b>'+esc(o.order_number)+'</b></div><div class="track-box"><span>STATUSI</span><b>'+esc(o.order_status)+'</b></div><div class="track-box"><span>PAGESA</span><b>'+esc(o.payment_status)+'</b></div></div>'+(o.tracking_number?'<div class="track-note"><strong>Gjurmimi:</strong> '+esc(o.shipping_carrier||'')+' '+esc(o.tracking_number)+'</div>':'')+'<div class="track-note">Për detaje të plota, hyr te <a href="account.html?view=orders">Llogaria ime</a>.</div>'}catch(err){out.innerHTML='<div class="track-note" style="color:#a33">'+esc(err.message)+'</div>'}})})();</script></body></html>
