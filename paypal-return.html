<!doctype html><html lang="sq"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>PayPal — ZemZem</title><link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="assets/css/commerce.css?v=1"></head><body><header class="header"><div class="container"><div class="header-row compact"><a class="brand" href="index.html"><span class="brand-mark"></span><span>ZemZem</span></a></div></div></header><section class="section"><div class="container"><div class="payment-return-card" id="paypalReturn"><h1>Po finalizohet pagesa…</h1><p>Mos e mbyll këtë faqe.</p></div></div></section><script>
const SB='https://ysvtrhizgcioyycwlkrk.supabase.co',KEY='sb_publishable_HosI5ns0isB0FyQHrGbXwA_9LKzaFMD';
(async()=>{const box=document.getElementById('paypalReturn'),id=new URLSearchParams(location.search).get('token');if(!id){box.innerHTML='<h1>Pagesa nuk u gjet</h1><p>Kthehu te checkout-i dhe provo përsëri.</p><a class="btn btn-primary" href="checkout.html">Kthehu te checkout</a>';return}try{const r=await fetch(`${SB}/functions/v1/paypal-capture`,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({paypal_order_id:id})});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.message||d.error||'Pagesa nuk u finalizua');localStorage.removeItem('zemzem_cart');localStorage.removeItem('zemzem_checkout_token');box.innerHTML=`<div class="success-icon">✓</div><h1>Pagesa u krye me sukses</h1><p>Porosia: <strong>${d.order?.order_number||''}</strong></p><p>Totali: <strong>${Number(d.order?.total||0).toFixed(2)} €</strong></p><a class="btn btn-primary" href="account.html">Shiko llogarinë time</a> <a class="btn btn-light" href="shop.html">Vazhdo blerjet</a>`}catch(e){box.innerHTML=`<h1>Pagesa nuk u finalizua</h1><p>${String(e.message||e)}</p><a class="btn btn-primary" href="checkout.html">Kthehu te checkout</a>`}})();
</script></body></html>
