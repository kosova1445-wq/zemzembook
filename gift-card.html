<!doctype html><html lang="sq"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gift Card — ZemZem</title><meta name="description" content="Dërgo një Gift Card ZemZem me email."><link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="assets/css/brand.css?v=9"><style>
body{background:#f6f8f7}.gc-wrap{max-width:980px;margin:40px auto;padding:0 18px}.gc-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}.gc-card{background:#fff;border:1px solid #e1e8e4;border-radius:16px;padding:22px}.gc-card h1{margin:0 0 8px}.gc-form{display:grid;gap:12px}.gc-form label{display:grid;gap:6px;font-size:12px;font-weight:800}.gc-form input,.gc-form textarea,.gc-form select{min-height:44px;border:1px solid #dbe5df;border-radius:9px;padding:10px}.gc-preview{min-height:260px;border-radius:18px;padding:24px;color:#fff;background:linear-gradient(135deg,#173d2b,#2a6c4a);display:flex;flex-direction:column;justify-content:space-between}.gc-amount{font-size:42px;font-weight:900}.gc-code{font:700 18px ui-monospace,monospace;letter-spacing:.08em}.gc-status{margin-top:14px;padding:12px;border-radius:10px;background:#f4f7f5}.gc-status.error{background:#fff0ef;color:#9f2f26}.gc-status.success{background:#eef9f1;color:#17653b}.gc-note{font-size:11px;color:#738079}@media(max-width:800px){.gc-grid{grid-template-columns:1fr}}</style></head><body>
<div class="topbar"><div class="container"><span>🎁 Gift Card ZemZem</span><div class="tiny-links"><a href="index.html">Ballina</a><a href="shop.html">Dyqani</a></div></div></div>
<div class="gc-wrap"><div class="gc-grid"><section class="gc-card"><div class="eyebrow">DHURATË DIGJITALE</div><h1>Gift Card ZemZem</h1><p>Zgjidh vlerën, shkruaj marrësin dhe përfundo pagesën me PayPal.</p><form id="giftForm" class="gc-form"><label>Emri yt<input name="purchaser_name" maxlength="120" required></label><label>Emaili yt<input name="purchaser_email" type="email" required></label><label>Emri i marrësit<input name="recipient_name" maxlength="120" required></label><label>Emaili i marrësit<input name="recipient_email" type="email" required></label><label>Vlera<select name="amount"><option value="10">10 €</option><option value="20">20 €</option><option value="25">25 €</option><option value="50">50 €</option><option value="100">100 €</option><option value="150">150 €</option><option value="200">200 €</option></select></label><label>Mesazhi<textarea name="message" maxlength="500" rows="4" placeholder="Mesazh për marrësin..."></textarea></label><button id="giftPayBtn" class="btn btn-primary" type="submit">Vazhdo me PayPal</button></form><div id="giftStatus" class="gc-status" hidden></div><p class="gc-note">Kodi krijohet vetëm pasi pagesa PayPal konfirmohet. Vlen 12 muaj nga data e blerjes.</p></section><aside class="gc-card"><div class="gc-preview"><div><div style="font-size:13px;opacity:.8">ZEMZEM GIFT CARD</div><div style="font-size:28px;font-weight:900;margin-top:8px">Për librat që do</div></div><div><div class="gc-amount" id="giftPreviewAmount">10 €</div><div class="gc-code">ZEMZEM-••••-••••</div></div></div></aside></div></div>
<script>
const SB='https://ysvtrhizgcioyycwlkrk.supabase.co',KEY='sb_publishable_HosI5ns0isB0FyQHrGbXwA_9LKzaFMD',q=s=>document.querySelector(s);
async function edge(name,body){const r=await fetch(SB+'/functions/v1/'+name,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(body),cache:'no-store'});const t=await r.text();let d={};try{d=t?JSON.parse(t):{}}catch{}if(!r.ok)throw new Error(d.message||d.error||('HTTP '+r.status));return d}
function status(t,err=false){const e=q('#giftStatus');e.hidden=false;e.textContent=t;e.className='gc-status '+(err?'error':'success')}
q('[name="amount"]').addEventListener('change',e=>q('#giftPreviewAmount').textContent=e.target.value+' €');
q('#giftForm').addEventListener('submit',async e=>{e.preventDefault();const b=q('#giftPayBtn'),f=new FormData(e.currentTarget),body={purchaser_name:f.get('purchaser_name'),purchaser_email:f.get('purchaser_email'),recipient_name:f.get('recipient_name'),recipient_email:f.get('recipient_email'),amount:Number(f.get('amount')),message:f.get('message')};b.disabled=true;b.textContent='Duke hapur PayPal…';try{const req=await edge('gift-card-request',body),pp=await edge('gift-card-paypal-init',{id:req.id});location.href=pp.approve_url}catch(err){status(err.message,true);b.disabled=false;b.textContent='Vazhdo me PayPal'}});
(async()=>{const p=new URLSearchParams(location.search);if(p.get('paypal')==='return'&&p.get('id')){q('#giftForm').hidden=true;status('Duke konfirmuar pagesën…');try{const d=await edge('gift-card-paypal-capture',{id:p.get('id')}),g=d.gift_card||{};q('#giftStatus').innerHTML='<strong>Pagesa u konfirmua.</strong><br>Kodi: <strong>'+String(g.code||'')+'</strong><br>Vlera: <strong>'+Number(g.balance||0).toFixed(2)+' €</strong>';q('#giftStatus').className='gc-status success';q('#giftPreviewAmount').textContent=Number(g.balance||0).toFixed(2)+' €';document.querySelector('.gc-code').textContent=String(g.code||'')}catch(err){status(err.message,true)}}else if(p.get('paypal')==='cancel'){status('Pagesa u anulua. Mund ta provosh përsëri.',true)}})();
</script><script src="assets/js/storefront-observability.js?v=1"></script><script src="assets/js/storefront-controls.js?v=1"></script></body></html>
