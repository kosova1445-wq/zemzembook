<!doctype html><html lang="sq"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Llogaria ime — ZemZem</title><meta name="description" content="Menaxho profilin, adresat, porositë dhe wishlist-in në ZemZem."><link rel="canonical" href="https://www.zemzem.al/account.html"><link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="assets/css/account.css?v=1"></head><body>
<header class="simple-head"><a class="brand" href="index.html"><span class="brand-mark"></span><span>ZemZem</span></a><nav><a href="shop.html">Librat</a><a href="checkout.html">Shporta <span data-cart-count>0</span></a><a href="account.html" class="active">Llogaria ime</a></nav></header>
<main class="account-shell">
<section id="authPanel" class="account-auth"><div class="auth-copy"><span class="eyebrow">LLOGARIA IME</span><h1>Hyr ose krijo llogari</h1><p>Ruaj adresat, shiko porositë dhe mbaj librat e preferuar.</p></div><div class="auth-box"><div class="auth-tabs"><button class="active" data-auth-tab="login">Hyr</button><button data-auth-tab="signup">Regjistrohu</button></div><form id="loginForm" class="account-form"><label>Email<input name="email" type="email" required autocomplete="email"></label><label>Fjalëkalimi<input name="password" type="password" minlength="8" required autocomplete="current-password"></label><button class="btn btn-primary" type="submit">Hyr</button></form><form id="signupForm" class="account-form" hidden><div class="two"><label>Emri<input name="first_name" required></label><label>Mbiemri<input name="last_name" required></label></div><label>Email<input name="email" type="email" required autocomplete="email"></label><label>Telefoni<input name="phone" autocomplete="tel"></label><label>Fjalëkalimi<input name="password" type="password" minlength="8" required autocomplete="new-password"></label><button class="btn btn-primary" type="submit">Krijo llogarinë</button></form><div id="authMsg" class="account-msg" hidden></div></div></section>
<section id="accountPanel" hidden><div class="account-top"><div><span class="eyebrow">ZEMZEM</span><h1 id="welcomeTitle">Llogaria ime</h1><p id="customerEmail"></p></div><button id="logoutBtn" class="btn btn-light">Dil</button></div><div class="account-grid"><aside class="account-nav"><button class="active" data-account-view="orders">Porositë e mia</button><button data-account-view="profile">Profili</button><button data-account-view="addresses">Adresat</button><button data-account-view="wishlist">Wishlist</button></aside><div class="account-content">
<div id="view-orders" class="account-view active"><div class="section-head"><h2>Porositë e mia</h2><button id="refreshOrders" class="text-btn">Rifresko</button></div><div id="ordersList"></div></div>
<div id="view-profile" class="account-view"><h2>Profili</h2><form id="profileForm" class="account-form wide"><div class="two"><label>Emri<input id="profileFirst" required></label><label>Mbiemri<input id="profileLast" required></label></div><label>Telefoni<input id="profilePhone"></label><button class="btn btn-primary">Ruaj profilin</button></form></div>
<div id="view-addresses" class="account-view"><div class="section-head"><h2>Adresat</h2><button id="newAddressBtn" class="btn btn-primary compact">＋ Adresë</button></div><div id="addressList"></div><form id="addressForm" class="account-form wide address-form" hidden><input id="addressId" type="hidden"><div class="two"><label>Emri<input id="addrFirst" required></label><label>Mbiemri<input id="addrLast" required></label></div><label>Adresa<input id="addrLine1" required></label><label>Adresa 2<input id="addrLine2"></label><div class="two"><label>Qyteti<input id="addrCity" required></label><label>Kodi postar<input id="addrPostal"></label></div><div class="two"><label>Shteti<select id="addrCountry"><option value="KS">Kosovë</option><option value="AL">Shqipëri</option><option value="MK">Maqedoni e Veriut</option></select></label><label>Telefoni<input id="addrPhone" required></label></div><label class="check"><input id="addrDefault" type="checkbox"> Adresa kryesore</label><div class="form-actions"><button type="button" id="cancelAddress" class="btn btn-light">Anulo</button><button class="btn btn-primary">Ruaj adresën</button></div></form></div>
<div id="view-wishlist" class="account-view"><h2>Wishlist</h2><div id="wishlistList"></div></div>
</div></div></section></main><div id="accountToast" class="account-toast" hidden></div><script src="assets/js/app-v5.js?v=1"></script><script src="assets/js/account.js?v=1"></script></body></html>
