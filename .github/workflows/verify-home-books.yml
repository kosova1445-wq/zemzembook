name: Verify Homepage Books Manager

on:
  push:
    branches: [main]
    paths:
      - 'admin.html'
      - 'assets/js/admin-home-books.js'
      - 'assets/js/admin-book-helper.js'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/verify-home-books.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for production deploy
        run: sleep 105
      - name: Verify live admin manager
        shell: bash
        run: |
          set -euxo pipefail
          stamp="${GITHUB_SHA}-$(date +%s)"
          curl -L --fail --silent --show-error --max-time 25 "https://www.zemzem.al/admin.html?verify=${stamp}" -o /tmp/admin.html
          grep -Fq 'assets/js/admin-home-books.js?v=4' /tmp/admin.html
          curl -L --fail --silent --show-error --max-time 25 "https://www.zemzem.al/assets/js/admin-home-books.js?verify=${stamp}" -o /tmp/admin-home-books.js
          grep -Fq 'Seksionet e librave në Ballinë' /tmp/admin-home-books.js
          grep -Fq 'Ruaj të gjitha seksionet' /tmp/admin-home-books.js
          grep -Fq 'Featured Collection' /tmp/admin-home-books.js
          echo 'HOMEPAGE_BOOKS_MANAGER_LIVE=yes'
