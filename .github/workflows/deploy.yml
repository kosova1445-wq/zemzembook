name: Deploy ZemZem to cPanel

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

concurrency:
  group: zemzem-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debounce and keep only latest commit
        id: latest
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "Manual deploy requested."
            exit 0
          fi

          # Wait briefly so a burst of edits can settle before touching production.
          sleep 20
          LATEST_SHA="$(git ls-remote origin refs/heads/main | cut -f1)"

          if [ -z "$LATEST_SHA" ]; then
            echo "Could not resolve latest main SHA; continuing with current run."
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          elif [ "$LATEST_SHA" != "$GITHUB_SHA" ]; then
            echo "Newer commit exists: $LATEST_SHA"
            echo "Skipping obsolete deploy: $GITHUB_SHA"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "This is the latest main commit: $GITHUB_SHA"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate deployment secrets
        if: steps.latest.outputs.deploy == 'true'
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          test -n "$FTP_USERNAME" || (echo "Missing FTP_USERNAME" && exit 1)
          test -n "$FTP_PASSWORD" || (echo "Missing FTP_PASSWORD" && exit 1)
          test -n "$FTP_PORT" || (echo "Missing FTP_PORT" && exit 1)
          test -n "$FTP_SERVER_DIR" || (echo "Missing FTP_SERVER_DIR" && exit 1)

      - name: Deploy files via FTPS control and PASV
        if: steps.latest.outputs.deploy == 'true'
        env:
          FTP_SERVER: quebec.us.hostns.io
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          upload() {
            local src="$1"
            local dst="$2"
            curl --fail --show-error --silent \
              --connect-timeout 20 --max-time 60 --retry 2 --retry-delay 2 \
              --ftp-ssl-control \
              --disable-epsv \
              --ftp-skip-pasv-ip \
              --ftp-create-dirs \
              --user "$FTP_USERNAME:$FTP_PASSWORD" \
              --upload-file "$src" \
              "ftp://${FTP_SERVER}:${FTP_PORT}${FTP_SERVER_DIR}${dst}"
          }

          upload index.html index.html
          upload shop.html shop.html
          upload checkout.html checkout.html
          upload product.html product.html
          upload admin.html admin.html
          upload account.html account.html
          upload paypal-return.html paypal-return.html
          upload about.html about.html
          upload contact.html contact.html
          upload privacy.html privacy.html
          upload terms.html terms.html
          upload shipping-returns.html shipping-returns.html
          upload robots.txt robots.txt
          upload sitemap.xml sitemap.xml
          upload favicon.svg favicon.svg

          upload assets/css/style.css assets/css/style.css
          upload assets/css/product.css assets/css/product.css
          upload assets/css/admin.css assets/css/admin.css
          upload assets/css/admin-v2.css assets/css/admin-v2.css
          upload assets/css/account.css assets/css/account.css
          upload assets/css/commerce.css assets/css/commerce.css

          upload assets/js/app-v5.js assets/js/app-v5.js
          upload assets/js/account.js assets/js/account.js
          upload assets/js/checkout-v2.js assets/js/checkout-v2.js
          upload assets/js/admin-v2.js assets/js/admin-v2.js

      - name: Verify live ZemZem commerce v2
        if: steps.latest.outputs.deploy == 'true'
        shell: bash
        run: |
          check_contains() {
            local url="$1"
            local pattern="$2"
            local out="$3"

            for attempt in 1 2 3 4 5 6; do
              if curl -L --fail --silent --show-error --max-time 20 \
                "${url}?deploy=${GITHUB_SHA}&attempt=${attempt}" -o "$out" \
                && grep -q "$pattern" "$out"; then
                return 0
              fi
              echo "Waiting for live update: $url (attempt $attempt/6)"
              sleep 3
            done

            echo "Verification failed for $url; expected: $pattern"
            return 1
          }

          check_exists() {
            local url="$1"
            local out="$2"

            for attempt in 1 2 3 4 5 6; do
              if curl -L --fail --silent --show-error --max-time 20 \
                "${url}?deploy=${GITHUB_SHA}&attempt=${attempt}" -o "$out"; then
                return 0
              fi
              sleep 3
            done

            echo "Verification failed for $url"
            return 1
          }

          check_contains https://www.zemzem.al/ 'assets/js/app-v5.js' /tmp/index.html
          grep -q 'account.html' /tmp/index.html

          check_contains https://www.zemzem.al/assets/js/app-v5.js 'storefront_books' /tmp/app-v5.js
          grep -q 'toggleWishlist' /tmp/app-v5.js

          check_contains https://www.zemzem.al/shop.html 'assets/js/app-v5.js' /tmp/shop.html
          check_contains https://www.zemzem.al/product.html 'assets/js/app-v5.js' /tmp/product.html

          check_contains https://www.zemzem.al/checkout.html 'checkout-v2.js' /tmp/checkout.html
          grep -q 'couponCode' /tmp/checkout.html

          check_contains https://www.zemzem.al/account.html 'account.js' /tmp/account.html
          grep -q 'Porositë e mia' /tmp/account.html

          check_contains https://www.zemzem.al/admin.html 'admin-v2.js' /tmp/admin.html
          grep -q 'Kuponët' /tmp/admin.html

          check_contains https://www.zemzem.al/paypal-return.html 'paypal-capture' /tmp/paypal.html

          for page in about.html contact.html privacy.html terms.html shipping-returns.html robots.txt sitemap.xml favicon.svg; do
            check_exists "https://www.zemzem.al/$page" "/tmp/$(basename "$page")"
          done

          echo 'ZEMZEM_COMMERCE_V2_LIVE_OK=yes'

      - name: Obsolete commit skipped safely
        if: steps.latest.outputs.deploy != 'true'
        run: |
          echo "A newer commit is already on main. This old deployment was skipped successfully."
