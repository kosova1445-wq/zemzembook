name: Deploy ZemZem to cPanel

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

concurrency:
  group: zemzem-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update -y && sudo apt-get install -y lftp

      - name: Validate deployment secrets
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          test -n "$FTP_USERNAME" || (echo "Missing FTP_USERNAME" && exit 1)
          test -n "$FTP_PASSWORD" || (echo "Missing FTP_PASSWORD" && exit 1)
          test -n "$FTP_PORT" || (echo "Missing FTP_PORT" && exit 1)
          test -n "$FTP_SERVER_DIR" || (echo "Missing FTP_SERVER_DIR" && exit 1)

      - name: Inspect FTP root
        env:
          FTP_SERVER: quebec.us.hostns.io
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        run: |
          lftp -c "
            set cmd:fail-exit yes;
            set net:max-retries 2;
            set net:timeout 20;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate yes;
            open -p ${FTP_PORT} -u \"${FTP_USERNAME}\",\"${FTP_PASSWORD}\" ftp://${FTP_SERVER};
            pwd;
            cls -la;
            bye;
          "

      - name: Deploy via explicit FTPS
        env:
          FTP_SERVER: quebec.us.hostns.io
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          lftp -c "
            set cmd:fail-exit yes;
            set net:max-retries 2;
            set net:timeout 20;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate yes;
            open -p ${FTP_PORT} -u \"${FTP_USERNAME}\",\"${FTP_PASSWORD}\" ftp://${FTP_SERVER};
            cd \"${FTP_SERVER_DIR}\";
            mirror --reverse --verbose --parallel=4 \
              --exclude-glob .git* \
              --exclude-glob .github* \
              --exclude-glob README.md \
              ./ ./;
            bye;
          "
