name: Deploy ZemZem to cPanel

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

concurrency:
  group: zemzem-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate deployment secrets
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          test -n "$FTP_USERNAME" || (echo "Missing FTP_USERNAME" && exit 1)
          test -n "$FTP_PASSWORD" || (echo "Missing FTP_PASSWORD" && exit 1)
          test -n "$FTP_PORT" || (echo "Missing FTP_PORT" && exit 1)
          test -n "$FTP_SERVER_DIR" || (echo "Missing FTP_SERVER_DIR" && exit 1)

      - name: Deploy files via FTPS control and PASV
        env:
          FTP_SERVER: quebec.us.hostns.io
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          upload() {
            local src="$1"
            local dst="$2"
            curl --fail --show-error --silent \
              --connect-timeout 20 --max-time 60 --retry 1 \
              --ftp-ssl-control \
              --disable-epsv \
              --ftp-skip-pasv-ip \
              --ftp-create-dirs \
              --user "$FTP_USERNAME:$FTP_PASSWORD" \
              --upload-file "$src" \
              "ftp://${FTP_SERVER}:${FTP_PORT}${FTP_SERVER_DIR}${dst}"
          }

          upload index.html index.html
          upload shop.html shop.html
          upload checkout.html checkout.html
          upload product.html product.html
          upload admin.html admin.html
          upload account.html account.html
          upload paypal-return.html paypal-return.html
          upload about.html about.html
          upload contact.html contact.html
          upload privacy.html privacy.html
          upload terms.html terms.html
          upload shipping-returns.html shipping-returns.html
          upload robots.txt robots.txt
          upload sitemap.xml sitemap.xml
          upload favicon.svg favicon.svg

          upload assets/css/style.css assets/css/style.css
          upload assets/css/product.css assets/css/product.css
          upload assets/css/admin.css assets/css/admin.css
          upload assets/css/admin-v2.css assets/css/admin-v2.css
          upload assets/css/account.css assets/css/account.css
          upload assets/css/commerce.css assets/css/commerce.css

          upload assets/js/app-v5.js assets/js/app-v5.js
          upload assets/js/account.js assets/js/account.js
          upload assets/js/checkout-v2.js assets/js/checkout-v2.js
          upload assets/js/admin-v2.js assets/js/admin-v2.js

      - name: Verify live ZemZem commerce v2
        run: |
          sleep 3

          curl -L --fail --silent --show-error --max-time 20 https://www.zemzem.al/ -o /tmp/index.html
          grep -q 'assets/js/app-v5.js' /tmp/index.html
          grep -q 'account.html' /tmp/index.html

          curl -L --fail --silent --show-error --max-time 20 https://www.zemzem.al/assets/js/app-v5.js -o /tmp/app-v5.js
          grep -q 'storefront_books' /tmp/app-v5.js
          grep -q 'toggleWishlist' /tmp/app-v5.js

          curl -L --fail --silent --show-error --max-time 20 https://www.zemzem.al/shop.html -o /tmp/shop.html
          grep -q 'assets/js/app-v5.js' /tmp/shop.html

          curl -L --fail --silent --show-error --max-time 20 https://www.zemzem.al/product.html -o /tmp/product.html
          grep -q 'assets/js/app-v5.js' /tmp/product.html

          curl -L --fail --silent --show-error --max-time 20 https://www.zemzem.al/checkout.html -o /tmp/checkout.html
          grep -q 'assets/js/app-v5.js' /tmp/checkout.html
          grep -q 'checkout-v2.js' /tmp/checkout.html
          grep -q 'couponCode' /tmp/checkout.html

          curl -L --fail --silent --show-error --max-time 20 https://www.zemzem.al/account.html -o /tmp/account.html
          grep -q 'account.js' /tmp/account.html
          grep -q 'Porositë e mia' /tmp/account.html

          curl -L --fail --silent --show-error --max-time 20 https://www.zemzem.al/admin.html -o /tmp/admin.html
          grep -q 'admin-v2.js' /tmp/admin.html
          grep -q 'Kuponët' /tmp/admin.html

          curl -L --fail --silent --show-error --max-time 20 https://www.zemzem.al/paypal-return.html -o /tmp/paypal.html
          grep -q 'paypal-capture' /tmp/paypal.html

          for page in about.html contact.html privacy.html terms.html shipping-returns.html robots.txt sitemap.xml favicon.svg; do
            curl -L --fail --silent --show-error --max-time 20 "https://www.zemzem.al/$page" -o "/tmp/$(basename "$page")"
          done

          echo 'ZEMZEM_COMMERCE_V2_LIVE_OK=yes'
