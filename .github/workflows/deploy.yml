name: Deploy ZemZem to cPanel

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

concurrency:
  group: zemzem-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate deployment secrets
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          test -n "$FTP_USERNAME" || (echo "Missing FTP_USERNAME" && exit 1)
          test -n "$FTP_PASSWORD" || (echo "Missing FTP_PASSWORD" && exit 1)
          test -n "$FTP_PORT" || (echo "Missing FTP_PORT" && exit 1)
          test -n "$FTP_SERVER_DIR" || (echo "Missing FTP_SERVER_DIR" && exit 1)

      - name: Deploy files via FTPS control and PASV
        env:
          FTP_SERVER: quebec.us.hostns.io
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          upload() {
            local src="$1"
            local dst="$2"
            curl --fail --show-error --silent \
              --connect-timeout 20 --max-time 60 --retry 1 \
              --ftp-ssl-control \
              --disable-epsv \
              --ftp-skip-pasv-ip \
              --ftp-create-dirs \
              --user "$FTP_USERNAME:$FTP_PASSWORD" \
              --upload-file "$src" \
              "ftp://${FTP_SERVER}:${FTP_PORT}${FTP_SERVER_DIR}${dst}"
          }

          upload index.html index.html
          upload shop.html shop.html
          upload checkout.html checkout.html
          upload assets/css/style.css assets/css/style.css
          upload assets/js/app.js assets/js/app.js

      - name: Verify live homepage
        run: |
          sleep 2
          echo "--- LIVE ROOT TITLE / MARKERS ---"
          curl -L --fail --silent --show-error --max-time 20 https://www.zemzem.al/ -o /tmp/live.html
          grep -o -m1 '<title>[^<]*</title>' /tmp/live.html || true
          if grep -q 'Trending në ZemZem' /tmp/live.html; then
            echo 'LIVE_ROOT_IS_NEW_ZEMZEM=yes'
          else
            echo 'LIVE_ROOT_IS_NEW_ZEMZEM=no'
          fi
          echo "--- DIRECT INDEX.HTML ---"
          curl -L --fail --silent --show-error --max-time 20 https://www.zemzem.al/index.html -o /tmp/indexhtml
          grep -o -m1 '<title>[^<]*</title>' /tmp/indexhtml || true
          if grep -q 'Trending në ZemZem' /tmp/indexhtml; then
            echo 'INDEX_HTML_IS_NEW_ZEMZEM=yes'
          else
            echo 'INDEX_HTML_IS_NEW_ZEMZEM=no'
          fi
          if grep -q 'Kurani Fisnik' https://www.zemzem.al/assets/js/app.js 2>/dev/null; then
            echo 'APP_JS_HAS_SAMPLE_BOOKS=yes'
          else
            echo 'APP_JS_HAS_SAMPLE_BOOKS=no'
          fi
