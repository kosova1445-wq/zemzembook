          require_live https://www.zemzem.al/checkout.html /tmp/checkout-coupon.html 'assets/js/checkout-v2.js' 'Checkout script reference'
          require_live https://www.zemzem.al/assets/js/checkout-v2.js /tmp/checkout-v2.js 'appliedCouponCode' 'Server-validated coupon state'
          require_live https://www.zemzem.al/assets/js/checkout-v2.js /tmp/checkout-v2.js "coupon_code:''" 'Invalid coupon keeps shipping and COD'
          require_live https://www.zemzem.al/assets/js/branding.js /tmp/branding.js 'zemzem-menu-font-desktop' 'Global menu typography'
