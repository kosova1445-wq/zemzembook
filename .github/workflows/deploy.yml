          require_live https://www.zemzem.al/product.html /tmp/product-meta.html 'Data e botimit' 'Product publish date detail'
          require_live https://www.zemzem.al/product.html /tmp/product-meta.html 'Dimensionet' 'Product dimensions detail'
          require_live https://www.zemzem.al/product.html /tmp/product-review.html 'premiumReviewForm' 'Verified buyer review form live'
          require_live https://www.zemzem.al/product.html /tmp/product-review.html 'review-star-picker' 'Visible review form on every product'
