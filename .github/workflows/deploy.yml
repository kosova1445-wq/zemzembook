name: Deploy ZemZem to cPanel

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

concurrency:
  group: zemzem-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Debounce and keep only latest commit
        id: latest
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sleep 12
          LATEST_SHA="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ -n "$LATEST_SHA" ] && [ "$LATEST_SHA" != "$GITHUB_SHA" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate deployment secrets
        if: steps.latest.outputs.deploy == 'true'
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          test -n "$FTP_USERNAME"
          test -n "$FTP_PASSWORD"
          test -n "$FTP_PORT"
          test -n "$FTP_SERVER_DIR"

      - name: Deploy current protected release
        if: steps.latest.outputs.deploy == 'true'
        env:
          FTP_SERVER: quebec.us.hostns.io
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
          BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          upload() {
            local src="$1"
            curl --fail --show-error --silent \
              --connect-timeout 20 --max-time 60 --retry 2 --retry-delay 2 \
              --ftp-ssl-control --disable-epsv --ftp-skip-pasv-ip --ftp-create-dirs \
              --user "$FTP_USERNAME:$FTP_PASSWORD" \
              --upload-file "$src" \
              "ftp://${FTP_SERVER}:${FTP_PORT}${FTP_SERVER_DIR}${src}"
            echo "Uploaded: $src"
          }

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CHANGED=""
          elif [ -n "${BEFORE_SHA:-}" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            CHANGED="$(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA")"
          else
            CHANGED="$(git diff --name-only HEAD~1 HEAD)"
          fi

          # Inject the public analytics bootstrap at build time. Admin pages intentionally stay analytics-free.
          ANALYTICS_TAG='<script src="assets/js/analytics.js?v=1"></script>'
          for page in \
            index.html shop.html product.html checkout.html paypal-return.html \
            about.html contact.html shipping-returns.html privacy.html terms.html account.html \
            ebooks.html ebook.html ebook-checkout.html ebook-paypal-return.html blog.html article.html; do
            if [ -f "$page" ] && ! grep -Fq 'assets/js/analytics.js' "$page"; then
              sed -i "s#</head>#${ANALYTICS_TAG}</head>#" "$page"
            fi
          done

          # Keep the safe book-create helper in the live admin without changing the classic admin design.
          ADMIN_BOOK_HELPER_TAG='<script src="assets/js/admin-book-helper.js?v=1"></script>'
          if [ -f admin.html ] && ! grep -Fq 'assets/js/admin-book-helper.js' admin.html; then
            sed -i "s#<script src=\"assets/js/admin-booksto.js?v=1\"></script>#<script src=\"assets/js/admin-booksto.js?v=1\"></script>${ADMIN_BOOK_HELPER_TAG}#" admin.html
          fi

          # Homepage featured-books manager: load it directly in admin so it is always visible in Faqja & Menu.
          ADMIN_HOME_BOOKS_TAG='<script src="assets/js/admin-home-books.js?v=4" data-admin-home-books="1"></script>'
          if [ -f admin.html ] && ! grep -Fq 'assets/js/admin-home-books.js' admin.html; then
            sed -i "s#<script src=\"assets/js/admin-book-helper.js?v=1\"></script>#<script src=\"assets/js/admin-book-helper.js?v=1\"></script>${ADMIN_HOME_BOOKS_TAG}#" admin.html
          fi

          # Always republish the complete protected production set.
          CHANGED="$CHANGED
          index.html
          shop.html
          product.html
          checkout.html
          paypal-return.html
          about.html
          contact.html
          shipping-returns.html
          privacy.html
          terms.html
          robots.txt
          sitemap.xml
          blog.html
          article.html
          assets/js/blog.js
          assets/css/blog.css
          assets/js/app-v5.js
          assets/js/home-modern.js
          assets/js/home-wow.js
          assets/js/home-bookstore-v2.js
          assets/css/home-professional-v4.css
          assets/css/home-modern.css
          assets/css/home-wow.css
          assets/css/home-bookstore-v2.css
          assets/css/home-ebukz3.css
          assets/css/home-category-preserve.css
          assets/js/checkout-v2.js
          assets/js/seo-product.js
          assets/js/analytics.js
          assets/css/style.css
          assets/css/product.css
          assets/css/commerce.css
          admin.html
          assets/js/admin-v2.js
          assets/js/admin-booksto.js
          assets/js/admin-book-helper.js
          assets/js/admin-home-books.js
          assets/js/admin-enterprise.js
          assets/js/admin-enterprise-tools.js
          assets/js/admin-enterprise-config.js
          assets/js/admin-marketing-suite.js
          assets/js/admin-stock-forecast.js
          assets/js/admin-blog.js
          assets/css/admin-blog.css
          assets/css/admin-v2.css
          assets/css/admin-booksto.css
          assets/css/admin-booksto-pages.css
          admin-ebooks.html
          assets/js/admin-ebooks.js
          assets/js/admin-ebooks-orders.js
          assets/css/admin-ebooks.css
          assets/css/admin-ebooks-booksto.css
          assets/css/ebook-mobile.css
          account.html
          assets/js/account.js
          assets/js/account-enterprise.js
          assets/css/account.css
          ebooks.html
          ebook.html
          ebook-checkout.html
          ebook-paypal-return.html
          assets/js/ebooks.js
          assets/js/ebook-checkout.js
          assets/js/ebook-paypal-return.js
          assets/js/seo-ebook.js
          assets/css/ebooks.css
          assets/css/ebook-checkout.css"

          printf '%s\n' "$CHANGED" | sed '/^[[:space:]]*$/d' | sort -u | while IFS= read -r file; do
            case "$file" in
              *.html|*.css|*.js|*.svg|robots.txt|sitemap.xml)
                if [ -f "$file" ]; then upload "$file"; fi
                ;;
              *) echo "Skipped non-site file: $file" ;;
            esac
          done

          # Storefront design files are released as one visual unit.
          upload "index.html"
          upload "assets/js/app-v5.js"
          upload "assets/js/home-modern.js"
          upload "assets/js/home-wow.js"
          upload "assets/css/site-premium-v3.css"
          upload "admin.html"
          upload "assets/js/admin-v2.js"
          upload "assets/js/admin-home-books.js"
          upload "assets/js/admin-enterprise.js"
          upload "assets/js/admin-enterprise-tools.js"
          upload "assets/js/admin-enterprise-config.js"
          upload "assets/js/admin-advanced.js"
          upload "assets/js/account.js"
          upload "assets/js/account-enterprise.js"
          upload "assets/js/account-advanced.js"

      - name: Verify live protected release
        if: steps.latest.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          fetch_live() {
            local url="$1" out="$2"
            for attempt in 1 2 3 4 5 6; do
              if curl -L --fail --silent --show-error --max-time 20 "${url}?deploy=${GITHUB_SHA}&attempt=${attempt}" -o "$out"; then
                return 0
              fi
              sleep 3
            done
            return 1
          }

          fetch_live https://www.zemzem.al/assets/js/analytics.js /tmp/analytics.js
          grep -Fq 'G-9TPM62WY0G' /tmp/analytics.js
          grep -Fq "event('purchase'" /tmp/analytics.js
          grep -Fq "analytics_storage" /tmp/analytics.js

          fetch_live https://www.zemzem.al/ /tmp/index.html
          grep -Fq 'ZemZem.al – Libra Shqip, eBook & Librari Online' /tmp/index.html
          grep -Fq 'application/ld+json' /tmp/index.html
          grep -Fq 'assets/js/analytics.js?v=1' /tmp/index.html
          grep -Fq 'assets/css/home-modern.css?v=1' /tmp/index.html
          grep -Fq 'assets/css/home-wow.css?v=1' /tmp/index.html
          grep -Fq 'assets/css/home-bookstore-v2.css?v=1' /tmp/index.html
          grep -Fq 'assets/js/home-wow.js?v=1' /tmp/index.html
          grep -Fq 'assets/js/home-bookstore-v2.js?v=3' /tmp/index.html
          fetch_live https://www.zemzem.al/assets/js/home-wow.js /tmp/home-wow.js
          grep -Fq 'wow-featured' /tmp/home-wow.js
          grep -Fq 'mega-menu-shell' /tmp/home-wow.js
          fetch_live https://www.zemzem.al/assets/css/home-wow.css /tmp/home-wow.css
          grep -Fq '.wow-featured' /tmp/home-wow.css
