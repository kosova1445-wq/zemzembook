name: Deploy ZemZem to cPanel

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

concurrency:
  group: zemzem-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Debounce and keep only latest commit
        id: latest
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sleep 12
          LATEST_SHA="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ -n "$LATEST_SHA" ] && [ "$LATEST_SHA" != "$GITHUB_SHA" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate deployment secrets
        if: steps.latest.outputs.deploy == 'true'
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          test -n "$FTP_USERNAME"
          test -n "$FTP_PASSWORD"
          test -n "$FTP_PORT"
          test -n "$FTP_SERVER_DIR"

      - name: Deploy changed files safely
        if: steps.latest.outputs.deploy == 'true'
        env:
          FTP_SERVER: quebec.us.hostns.io
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
          BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          upload() {
            local src="$1"
            curl --fail --show-error --silent \
              --connect-timeout 20 --max-time 60 --retry 2 --retry-delay 2 \
              --ftp-ssl-control --disable-epsv --ftp-skip-pasv-ip --ftp-create-dirs \
              --user "$FTP_USERNAME:$FTP_PASSWORD" \
              --upload-file "$src" \
              "ftp://${FTP_SERVER}:${FTP_PORT}${FTP_SERVER_DIR}${src}"
            echo "Uploaded: $src"
          }

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CHANGED="admin.html assets/js/admin-v2.js assets/css/admin-v2.css"
          elif [ -n "${BEFORE_SHA:-}" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            CHANGED="$(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA")"
          else
            CHANGED="$(git diff --name-only HEAD~1 HEAD)"
          fi

          # This release must publish the new admin even though this commit mainly changes CI.
          CHANGED="$CHANGED
          admin.html
          assets/js/admin-v2.js
          assets/css/admin-v2.css"

          printf '%s\n' "$CHANGED" | sed '/^[[:space:]]*$/d' | sort -u | while IFS= read -r file; do
            case "$file" in
              *.html|*.css|*.js|*.svg|robots.txt|sitemap.xml)
                if [ -f "$file" ]; then upload "$file"; fi
                ;;
              *) echo "Skipped non-site file: $file" ;;
            esac
          done

      - name: Verify live admin release
        if: steps.latest.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          check_contains() {
            local url="$1" pattern="$2" out="$3"
            for attempt in 1 2 3 4 5 6; do
              if curl -L --fail --silent --show-error --max-time 20 "${url}?deploy=${GITHUB_SHA}&attempt=${attempt}" -o "$out" && grep -q "$pattern" "$out"; then
                return 0
              fi
              sleep 3
            done
            echo "Verification failed for $url; expected: $pattern"
            return 1
          }
          check_contains https://www.zemzem.al/admin.html 'admin-v2.js?v=3' /tmp/admin.html
          check_contains https://www.zemzem.al/assets/js/admin-v2.js 'store-admin-ops' /tmp/admin-v2.js
          grep -q 'admin_update_physical_order' /tmp/admin-v2.js
          grep -q 'admin_customer_detail' /tmp/admin-v2.js
          echo 'ZEMZEM_ADMIN_LIVE_OK=yes'

      - name: Obsolete commit skipped safely
        if: steps.latest.outputs.deploy != 'true'
        run: echo "A newer commit is already on main; obsolete deployment skipped."
