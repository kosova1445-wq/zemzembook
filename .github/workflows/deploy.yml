name: Deploy ZemZem to cPanel

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

concurrency:
  group: zemzem-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Debounce and keep only latest commit
        id: latest
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sleep 12
          LATEST_SHA="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ -n "$LATEST_SHA" ] && [ "$LATEST_SHA" != "$GITHUB_SHA" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate deployment secrets
        if: steps.latest.outputs.deploy == 'true'
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          test -n "$FTP_USERNAME"
          test -n "$FTP_PASSWORD"
          test -n "$FTP_PORT"
          test -n "$FTP_SERVER_DIR"

      - name: Deploy current protected release
        if: steps.latest.outputs.deploy == 'true'
        env:
          FTP_SERVER: quebec.us.hostns.io
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
          BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          upload() {
            local src="$1"
            curl --fail --show-error --silent \
              --connect-timeout 20 --max-time 60 --retry 2 --retry-delay 2 \
              --ftp-ssl-control --disable-epsv --ftp-skip-pasv-ip --ftp-create-dirs \
              --user "$FTP_USERNAME:$FTP_PASSWORD" \
              --upload-file "$src" \
              "ftp://${FTP_SERVER}:${FTP_PORT}${FTP_SERVER_DIR}${src}"
            echo "Uploaded: $src"
          }

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CHANGED=""
          elif [ -n "${BEFORE_SHA:-}" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            CHANGED="$(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA")"
          else
            CHANGED="$(git diff --name-only HEAD~1 HEAD)"
          fi

          # Inject the public analytics bootstrap at build time. Admin pages intentionally stay analytics-free.
          ANALYTICS_TAG='<script src="assets/js/analytics.js?v=1"></script>'
          for page in \
            index.html shop.html product.html checkout.html paypal-return.html \
            about.html contact.html shipping-returns.html privacy.html terms.html account.html \
            ebooks.html ebook.html ebook-checkout.html ebook-paypal-return.html; do
            if [ -f "$page" ] && ! grep -Fq 'assets/js/analytics.js' "$page"; then
              sed -i "s#</head>#${ANALYTICS_TAG}</head>#" "$page"
            fi
          done

          # Always republish the complete protected production set. This prevents rapid
          # sequential commits from leaving production on an older storefront/admin version
          # when obsolete deploy jobs are intentionally skipped by the debounce step.
          CHANGED="$CHANGED
          index.html
          shop.html
          product.html
          checkout.html
          paypal-return.html
          about.html
          contact.html
          shipping-returns.html
          privacy.html
          terms.html
          robots.txt
          sitemap.xml
          assets/js/app-v5.js
          assets/js/checkout-v2.js
          assets/js/seo-product.js
          assets/js/analytics.js
          assets/css/style.css
          assets/css/product.css
          assets/css/commerce.css
          admin.html
          assets/js/admin-v2.js
          assets/js/admin-booksto.js
          assets/css/admin-v2.css
          assets/css/admin-booksto.css
          admin-ebooks.html
          assets/js/admin-ebooks.js
          assets/js/admin-ebooks-orders.js
          assets/css/admin-ebooks.css
          assets/css/ebook-mobile.css
          account.html
          assets/js/account.js
          assets/css/account.css
          ebooks.html
          ebook.html
          ebook-checkout.html
          ebook-paypal-return.html
          assets/js/ebooks.js
          assets/js/ebook-checkout.js
          assets/js/ebook-paypal-return.js
          assets/js/seo-ebook.js
          assets/css/ebooks.css
          assets/css/ebook-checkout.css"

          printf '%s\n' "$CHANGED" | sed '/^[[:space:]]*$/d' | sort -u | while IFS= read -r file; do
            case "$file" in
              *.html|*.css|*.js|*.svg|robots.txt|sitemap.xml)
                if [ -f "$file" ]; then upload "$file"; fi
                ;;
              *) echo "Skipped non-site file: $file" ;;
            esac
          done

      - name: Verify live protected release
        if: steps.latest.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          fetch_live() {
            local url="$1" out="$2"
            for attempt in 1 2 3 4 5 6; do
              if curl -L --fail --silent --show-error --max-time 20 "${url}?deploy=${GITHUB_SHA}&attempt=${attempt}" -o "$out"; then
                return 0
              fi
              sleep 3
            done
            return 1
          }

          fetch_live https://www.zemzem.al/assets/js/analytics.js /tmp/analytics.js
          grep -Fq 'G-9TPM62WY0G' /tmp/analytics.js
          grep -Fq "event('purchase'" /tmp/analytics.js
          grep -Fq "analytics_storage" /tmp/analytics.js

          fetch_live https://www.zemzem.al/ /tmp/index.html
          grep -Fq 'ZemZem.al – Libra Shqip, eBook & Librari Online' /tmp/index.html
          grep -Fq 'application/ld+json' /tmp/index.html
          grep -Fq 'assets/js/analytics.js?v=1' /tmp/index.html
          fetch_live https://www.zemzem.al/shop.html /tmp/shop.html
          grep -Fq 'Libra në Shqip – Dyqani i Librave Fizikë | ZemZem' /tmp/shop.html
          grep -Fq 'application/ld+json' /tmp/shop.html
          grep -Fq 'assets/js/analytics.js?v=1' /tmp/shop.html
          fetch_live https://www.zemzem.al/product.html /tmp/product.html
          grep -Fq 'seo-product.js?v=2' /tmp/product.html
          grep -Fq 'assets/js/analytics.js?v=1' /tmp/product.html
          fetch_live https://www.zemzem.al/assets/js/seo-product.js /tmp/seo-product.js
          grep -Fq 'zemzemProductSchema' /tmp/seo-product.js
          fetch_live https://www.zemzem.al/checkout.html /tmp/checkout.html
          grep -Fq 'assets/js/analytics.js?v=1' /tmp/checkout.html
          fetch_live https://www.zemzem.al/paypal-return.html /tmp/paypal-return.html
          grep -Fq 'assets/js/analytics.js?v=1' /tmp/paypal-return.html
          fetch_live https://www.zemzem.al/about.html /tmp/about.html
          grep -Fq 'Rreth ZemZem.al – Librari Online për Libra në Shqip' /tmp/about.html
          grep -Fq 'assets/js/analytics.js?v=1' /tmp/about.html
          fetch_live https://www.zemzem.al/contact.html /tmp/contact.html
          grep -Fq 'Kontakt & Ndihmë – Porosi, Libra dhe eBook | ZemZem' /tmp/contact.html
          grep -Fq 'assets/js/analytics.js?v=1' /tmp/contact.html
          fetch_live https://www.zemzem.al/shipping-returns.html /tmp/shipping.html
          grep -Fq 'Transporti, Tracking & Kthimet e Porosive | ZemZem' /tmp/shipping.html
          grep -Fq 'assets/js/analytics.js?v=1' /tmp/shipping.html
          fetch_live https://www.zemzem.al/privacy.html /tmp/privacy.html
          grep -Fq 'assets/js/analytics.js?v=1' /tmp/privacy.html
          fetch_live https://www.zemzem.al/terms.html /tmp/terms.html
          grep -Fq 'assets/js/analytics.js?v=1' /tmp/terms.html
          fetch_live https://www.zemzem.al/sitemap.xml /tmp/sitemap.xml
          grep -Fq 'product.html?id=' /tmp/sitemap.xml
          grep -Fq 'ebook.html?id=' /tmp/sitemap.xml

          fetch_live https://www.zemzem.al/admin.html /tmp/admin.html
          grep -Fq 'admin-v2.js?v=3' /tmp/admin.html
          grep -Fq 'admin-booksto.css?v=1' /tmp/admin.html
          grep -Fq 'admin-booksto.js?v=1' /tmp/admin.html
          if grep -Fq 'assets/js/analytics.js' /tmp/admin.html; then
            echo 'Analytics must not be loaded in admin.html'; exit 1
          fi
          fetch_live https://www.zemzem.al/assets/js/admin-v2.js /tmp/admin-v2.js
          grep -Fq 'store-admin-ops' /tmp/admin-v2.js
          grep -Fq 'admin_update_physical_order' /tmp/admin-v2.js
          grep -Fq 'admin_customer_detail' /tmp/admin-v2.js
          fetch_live https://www.zemzem.al/assets/js/admin-booksto.js /tmp/admin-booksto.js
          grep -Fq 'booksto-insight-grid' /tmp/admin-booksto.js
          grep -Fq 'Category Lists' /tmp/admin-booksto.js
          fetch_live https://www.zemzem.al/assets/css/admin-booksto.css /tmp/admin-booksto.css
          grep -Fq '.booksto-insight-grid' /tmp/admin-booksto.css
          grep -Fq '.side-section-label' /tmp/admin-booksto.css

          fetch_live https://www.zemzem.al/admin-ebooks.html /tmp/admin-ebooks.html
          grep -Fq 'admin-ebooks-orders.js?v=2' /tmp/admin-ebooks.html
          grep -Fq 'ebook-mobile.css?v=1' /tmp/admin-ebooks.html
          if grep -Fq 'assets/js/analytics.js' /tmp/admin-ebooks.html; then
            echo 'Analytics must not be loaded in admin-ebooks.html'; exit 1
          fi
          fetch_live https://www.zemzem.al/assets/js/admin-ebooks-orders.js /tmp/admin-ebooks-orders.js
          grep -Fq 'refund_order' /tmp/admin-ebooks-orders.js
          grep -Fq 'cleanup_generated_inactive' /tmp/admin-ebooks-orders.js

          fetch_live https://www.zemzem.al/account.html /tmp/account.html
          grep -Fq 'account.js?v=2' /tmp/account.html
          grep -Fq 'ebook-mobile.css?v=1' /tmp/account.html
          grep -Fq '#authPanel[hidden]' /tmp/account.html
          grep -Fq 'assets/js/analytics.js?v=1' /tmp/account.html
          if grep -Fq 'account-ebooks.js' /tmp/account.html; then
            echo 'Legacy account-ebooks.js is still referenced'; exit 1
          fi
          fetch_live https://www.zemzem.al/assets/js/account.js /tmp/account.js
          grep -Fq 'dedupeEntitlements' /tmp/account.js
          grep -Fq 'ebook-download' /tmp/account.js

          fetch_live https://www.zemzem.al/ebooks.html /tmp/ebooks.html
          grep -Fq 'eBook në Shqip – Libra Digjitalë PDF & EPUB | ZemZem' /tmp/ebooks.html
          grep -Fq 'ebooks.js?v=3' /tmp/ebooks.html
          grep -Fq 'ebook-mobile.css?v=1' /tmp/ebooks.html
          grep -Fq 'assets/js/analytics.js?v=1' /tmp/ebooks.html
          fetch_live https://www.zemzem.al/ebook.html /tmp/ebook.html
          grep -Fq 'ebooks.js?v=3' /tmp/ebook.html
          grep -Fq 'seo-ebook.js?v=1' /tmp/ebook.html
          grep -Fq 'assets/js/analytics.js?v=1' /tmp/ebook.html
          fetch_live https://www.zemzem.al/assets/js/ebooks.js /tmp/ebooks.js
          grep -Fq 'OWNED_EBOOK_IDS' /tmp/ebooks.js
          grep -Fq 'entitlementUsable' /tmp/ebooks.js
          fetch_live https://www.zemzem.al/assets/js/seo-ebook.js /tmp/seo-ebook.js
          grep -Fq 'zemzemEbookSchema' /tmp/seo-ebook.js

          fetch_live https://www.zemzem.al/ebook-checkout.html /tmp/ebook-checkout.html
          grep -Fq 'ebook-checkout.js?v=2' /tmp/ebook-checkout.html
          grep -Fq 'ebook-mobile.css?v=1' /tmp/ebook-checkout.html
          grep -Fq 'assets/js/analytics.js?v=1' /tmp/ebook-checkout.html
          fetch_live https://www.zemzem.al/assets/js/ebook-checkout.js /tmp/ebook-checkout.js
          grep -Fq 'cleanupOwnedCart' /tmp/ebook-checkout.js
          grep -Fq 'EBOOK_ALREADY_OWNED' /tmp/ebook-checkout.js
          fetch_live https://www.zemzem.al/ebook-paypal-return.html /tmp/ebook-paypal-return.html
          grep -Fq 'assets/js/analytics.js?v=1' /tmp/ebook-paypal-return.html

          fetch_live https://www.zemzem.al/assets/css/ebook-mobile.css /tmp/ebook-mobile.css
          grep -Fq 'ZemZem eBook responsive layer' /tmp/ebook-mobile.css
          echo 'ZEMZEM_PROTECTED_RELEASE_LIVE_OK=yes'

      - name: Obsolete commit skipped safely
        if: steps.latest.outputs.deploy != 'true'
        run: echo "A newer commit is already on main; obsolete deployment skipped safely."
