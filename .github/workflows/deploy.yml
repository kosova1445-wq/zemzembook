name: Deploy ZemZem to cPanel

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Debounce and keep only latest commit
        id: latest
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sleep 12
          LATEST_SHA="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ -n "$LATEST_SHA" ] && [ "$LATEST_SHA" != "$GITHUB_SHA" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate deployment secrets
        if: steps.latest.outputs.deploy == 'true'
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          test -n "$FTP_USERNAME"
          test -n "$FTP_PASSWORD"
          test -n "$FTP_PORT"
          test -n "$FTP_SERVER_DIR"

      - name: Generate dynamic sitemap
        if: steps.latest.outputs.deploy == 'true'
        shell: bash
        env:
          SB_URL: https://ysvtrhizgcioyycwlkrk.supabase.co
          SB_KEY: sb_publishable_HosI5ns0isB0FyQHrGbXwA_9LKzaFMD
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.parse, xml.etree.ElementTree as ET
          base='https://www.zemzem.al'
          sb=os.environ['SB_URL']; key=os.environ['SB_KEY']
          headers={'apikey':key,'Accept':'application/json'}
          def get(path):
              req=urllib.request.Request(sb+path,headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=25) as r:
                      return json.load(r)
              except Exception as e:
                  print('sitemap fetch warning:', path, e)
                  return []
          urls=[
              ('/', 'daily','1.0'),('/shop.html','daily','0.9'),('/ebooks.html','daily','0.9'),
              ('/blog.html','daily','0.8'),('/about.html','monthly','0.5'),('/contact.html','monthly','0.5'),
              ('/shipping-returns.html','monthly','0.4'),('/privacy.html','yearly','0.3'),('/terms.html','yearly','0.3')
          ]
          for b in get('/rest/v1/storefront_books?select=id,created_at&order=created_at.desc'):
              urls.append((f"/product.html?id={urllib.parse.quote(str(b['id']))}",'weekly','0.8',str(b.get('created_at') or '')[:10]))
          for e in get('/rest/v1/storefront_ebooks?select=id,created_at&order=created_at.desc'):
              urls.append((f"/ebook.html?id={urllib.parse.quote(str(e['id']))}",'weekly','0.8',str(e.get('created_at') or '')[:10]))
          for a in get('/rest/v1/blog_posts?status=eq.published&select=slug,published_at,updated_at&order=published_at.desc'):
              if a.get('slug'):
                  urls.append((f"/article.html?slug={urllib.parse.quote(str(a['slug']))}",'weekly','0.7',str(a.get('updated_at') or a.get('published_at') or '')[:10]))
          for a in get('/rest/v1/authors?is_active=eq.true&select=slug,updated_at&order=name.asc'):
              if a.get('slug'):
                  urls.append((f"/author.html?slug={urllib.parse.quote(str(a['slug']))}",'weekly','0.6',str(a.get('updated_at') or '')[:10]))
          for p in get('/rest/v1/publishers?is_active=eq.true&select=slug,updated_at&order=name.asc'):
              if p.get('slug'):
                  urls.append((f"/publisher.html?slug={urllib.parse.quote(str(p['slug']))}",'weekly','0.6',str(p.get('updated_at') or '')[:10]))
          ns='http://www.sitemaps.org/schemas/sitemap/0.9'
          ET.register_namespace('',ns)
          root=ET.Element('{%s}urlset'%ns)
          seen=set()
          for item in urls:
              path,freq,prio,*rest=item
              loc=base+path
              if loc in seen: continue
              seen.add(loc)
              u=ET.SubElement(root,'{%s}url'%ns)
              ET.SubElement(u,'{%s}loc'%ns).text=loc
              if rest and rest[0]:
                  ET.SubElement(u,'{%s}lastmod'%ns).text=rest[0]
              ET.SubElement(u,'{%s}changefreq'%ns).text=freq
              ET.SubElement(u,'{%s}priority'%ns).text=prio
          ET.ElementTree(root).write('sitemap.xml',encoding='utf-8',xml_declaration=True)
          print('Generated sitemap URLs:',len(seen))
          PY

      - name: Deploy current protected release
        if: steps.latest.outputs.deploy == 'true'
        env:
          FTP_SERVER: quebec.us.hostns.io
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
          BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          upload() {
            local src="$1"
            curl --fail --show-error --silent \
              --connect-timeout 20 --max-time 60 --retry 2 --retry-delay 2 \
              --ftp-ssl-control --disable-epsv --ftp-skip-pasv-ip --ftp-create-dirs \
              --user "$FTP_USERNAME:$FTP_PASSWORD" \
              --upload-file "$src" \
              "ftp://${FTP_SERVER}:${FTP_PORT}${FTP_SERVER_DIR}${src}"
            echo "Uploaded: $src"
          }

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CHANGED=""
          elif [ -n "${BEFORE_SHA:-}" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            CHANGED="$(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA")"
          else
            CHANGED="$(git diff --name-only HEAD~1 HEAD)"
          fi

          # Inject the public analytics bootstrap at build time. Admin pages intentionally stay analytics-free.
          ANALYTICS_TAG='<script src="assets/js/analytics.js?v=1"></script>'
          for page in \
            index.html shop.html product.html checkout.html paypal-return.html \
            about.html contact.html shipping-returns.html privacy.html terms.html account.html \
            ebooks.html ebook.html ebook-checkout.html ebook-paypal-return.html blog.html article.html; do
            if [ -f "$page" ] && ! grep -Fq 'assets/js/analytics.js' "$page"; then
              sed -i "s#</head>#${ANALYTICS_TAG}</head>#" "$page"
            fi
          done

          # Keep the safe book-create helper in the live admin without changing the classic admin design.
          ADMIN_BOOK_HELPER_TAG='<script src="assets/js/admin-book-helper.js?v=2"></script>'
          if [ -f admin.html ] && ! grep -Fq 'assets/js/admin-book-helper.js' admin.html; then
            sed -i "s#<script src=\"assets/js/admin-booksto.js?v=1\"></script>#<script src=\"assets/js/admin-booksto.js?v=1\"></script>${ADMIN_BOOK_HELPER_TAG}#" admin.html
          fi

          # Homepage featured-books manager: load it directly in admin so it is always visible in Faqja & Menu.
          ADMIN_HOME_BOOKS_TAG='<script src="assets/js/admin-home-books.js?v=4" data-admin-home-books="1"></script>'
          if [ -f admin.html ] && ! grep -Fq 'assets/js/admin-home-books.js' admin.html; then
            sed -i "s#<script src=\"assets/js/admin-book-helper.js?v=1\"></script>#<script src=\"assets/js/admin-book-helper.js?v=1\"></script>${ADMIN_HOME_BOOKS_TAG}#" admin.html
          fi

          # Always republish the complete protected production set.
          CHANGED="$CHANGED
          index.html
          shop.html
          product.html
          checkout.html
          paypal-return.html
          about.html
          contact.html
          shipping-returns.html
          privacy.html
          terms.html
          robots.txt
          sitemap.xml
          blog.html
          article.html
          author.html
          publisher.html
          assets/js/entity-page.js
          assets/css/entity-page.css
          assets/js/blog.js
          assets/css/blog.css
          assets/js/app-v5.js
          assets/js/shop-pro.js
          assets/css/shop-pro.css
          assets/css/price-ticket.css
          assets/js/storefront-funnel.js
          assets/js/admin-funnel.js
          assets/js/admin-paypal.js
          assets/css/book-gallery-v1.css
          assets/js/mobile-commerce-v3.js
          assets/css/mobile-commerce-v3.css
          assets/js/whatsapp-chat.js
          assets/js/home-modern.js
          assets/js/home-wow.js
          assets/js/home-bookstore-v2.js
          assets/js/home-mobile-v6.js
          assets/css/home-professional-v4.css
          assets/css/home-responsive-v5.css
          assets/css/home-modern.css
          assets/css/home-wow.css
          assets/css/home-bookstore-v2.css
          assets/css/home-ebukz3.css
          assets/css/home-category-preserve.css
          assets/js/checkout-v2.js
          assets/js/seo-product.js
          assets/js/analytics.js
          assets/css/style.css
          assets/css/product.css
          assets/css/commerce.css
          admin.html
          assets/js/admin-v2.js
          assets/js/admin-booksto.js
          assets/js/admin-book-helper.js
          assets/js/admin-home-books.js
          assets/js/admin-enterprise.js
          assets/js/admin-enterprise-tools.js
          assets/js/admin-enterprise-config.js
          assets/js/admin-marketing-suite.js
          assets/js/admin-stock-forecast.js
          assets/js/admin-abandoned.js
          assets/js/admin-reports.js
          assets/js/admin-social-contacts.js
          assets/js/admin-site-design.js
          assets/js/admin-branding.js
          assets/js/admin-media.js
          assets/js/admin-documents.js
          assets/js/admin-dashboard-v2.js
          assets/css/admin-branding.css
          assets/js/branding.js
          assets/css/brand.css
          assets/js/site-content.js
          assets/js/admin-blog.js
          assets/css/admin-blog.css
          assets/css/admin-v2.css
          assets/css/admin-booksto.css
          assets/css/admin-booksto-pages.css
          admin-ebooks.html
          assets/js/admin-ebooks.js
          assets/js/admin-ebooks-orders.js
          assets/css/admin-ebooks.css
          assets/css/admin-ebooks-booksto.css
          assets/css/ebook-mobile.css
          account.html
          assets/js/account.js
          assets/js/account-enterprise.js
          assets/css/account.css
          ebooks.html
          ebook.html
          ebook-checkout.html
          ebook-paypal-return.html
          assets/js/ebooks.js
          assets/js/ebook-checkout.js
          assets/js/ebook-paypal-return.js
          assets/js/seo-ebook.js
          assets/css/ebooks.css
          assets/css/ebook-checkout.css"

          printf '%s\n' "$CHANGED" | sed '/^[[:space:]]*$/d' | sort -u | while IFS= read -r file; do
            case "$file" in
              *.html|*.css|*.js|*.svg|robots.txt|sitemap.xml)
                if [ -f "$file" ]; then upload "$file"; fi
                ;;
              *) echo "Skipped non-site file: $file" ;;
            esac
          done

          # Storefront design files are released as one visual unit.
          upload "index.html"
          upload "assets/js/app-v5.js"
          upload "assets/js/shop-pro.js"
          upload "assets/css/shop-pro.css"
          upload "assets/css/price-ticket.css"
          upload "assets/css/search-autocomplete.css"
          upload "assets/js/storefront-funnel.js"
          upload "assets/js/admin-funnel.js"
          upload "assets/js/admin-paypal.js"
          upload "assets/css/book-gallery-v1.css"
          upload "assets/js/mobile-commerce-v3.js"
          upload "assets/css/mobile-commerce-v3.css"
          upload "assets/js/whatsapp-chat.js"
          upload "assets/js/home-modern.js"
          upload "assets/js/home-wow.js"
          upload "assets/js/home-mobile-v6.js"
          upload "assets/css/site-premium-v3.css"
          upload "admin.html"
          upload "assets/js/admin-v2.js"
          upload "assets/js/admin-home-books.js"
          upload "assets/js/admin-social-contacts.js"
          upload "assets/js/admin-site-design.js"
          upload "assets/js/admin-branding.js"
          upload "assets/js/admin-media.js"
          upload "assets/js/admin-documents.js"
          upload "assets/js/admin-dashboard-v2.js"
          upload "assets/css/admin-branding.css"
          upload "assets/js/branding.js"
          upload "assets/css/brand.css"
          upload "assets/js/site-content.js"
          upload "assets/js/admin-enterprise.js"
          upload "assets/js/admin-enterprise-tools.js"
          upload "assets/js/admin-enterprise-config.js"
          upload "assets/js/admin-abandoned.js"
          upload "assets/js/admin-reports.js"
          upload "assets/js/admin-gift-cards.js"
          upload "assets/js/admin-team.js"
          upload "assets/js/admin-advanced.js"
          upload "author.html"
          upload "publisher.html"
          upload "assets/js/entity-page.js"
          upload "assets/css/entity-page.css"
          upload "assets/js/account.js"
          upload "assets/js/account-enterprise.js"
          upload "assets/js/account-advanced.js"

      - name: Verify live protected release
        if: steps.latest.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail

          fetch_live() {
            local url="$1" out="$2"
            curl -L --fail --silent --show-error \
              -H 'Cache-Control: no-cache, no-store, must-revalidate' \
              -H 'Pragma: no-cache' \
              --max-time 25 \
              "${url}?deploy=${GITHUB_SHA}&ts=${GITHUB_RUN_ID}" -o "$out"
          }

          require_live() {
            local url="$1" out="$2" needle="$3" label="$4"
            for attempt in 1 2 3 4 5 6 7 8; do
              if fetch_live "$url" "$out" && grep -Fq "$needle" "$out"; then
                echo "OK: $label"
                return 0
              fi
              echo "Waiting for live update: $label (attempt $attempt/8)"
              sleep 5
            done
            echo "::error title=Live verification failed::$label was not found at $url"
            echo "Expected: $needle"
            echo "Response preview:"
            head -c 1200 "$out" || true
            echo
            return 1
          }

          require_live https://www.zemzem.al/shop.html /tmp/shop.html 'assets/css/shop-pro.css' 'Shop CSS reference'
          require_live https://www.zemzem.al/shop.html /tmp/shop.html 'assets/js/shop-pro.js' 'Shop JS reference'
          require_live https://www.zemzem.al/assets/js/shop-pro.js /tmp/shop-pro.js 'zz-ticket-price' 'Shop price ticket'
          require_live https://www.zemzem.al/assets/js/shop-pro.js /tmp/shop-pro.js 'OFERTË' 'Shop Albanian offer label'
          require_live https://www.zemzem.al/assets/js/shop-pro.js /tmp/shop-stock.js 'Ka në stok' 'Public stock hides exact quantity'
          require_live https://www.zemzem.al/product.html /tmp/product-stock.html "const stockText=unavailable?'Nuk ka stok':'Ka në stok';" 'Product stock hides exact quantity'

          require_live https://www.zemzem.al/assets/css/price-ticket.css /tmp/price-ticket.css '.zz-ticket-price' 'Shared price ticket CSS'
          require_live https://www.zemzem.al/index.html /tmp/index.html 'assets/js/home-modern.js' 'Homepage modern script'
          require_live https://www.zemzem.al/assets/js/home-modern.js /tmp/home-modern.js 'zz-hero-ticket' 'Homepage hero price ticket'
          require_live https://www.zemzem.al/ebooks.html /tmp/ebooks.html 'assets/css/price-ticket.css' 'eBook shared price ticket'
          require_live https://www.zemzem.al/product.html /tmp/product.html 'premium-price-ticket-wrap' 'Product price ticket'

          require_live https://www.zemzem.al/assets/css/home-professional-v4.css /tmp/home-professional.css 'glossy pill style inspired by reference' 'Glossy category pill CSS'
          require_live https://www.zemzem.al/index.html /tmp/index-categories.html 'assets/js/site-content.js?v=3' 'Homepage category controller version'
          require_live https://www.zemzem.al/assets/js/site-content.js /tmp/site-content.js 'linear-gradient(180deg,#ffffff 0%,#f3f4f5 100%)' 'White glossy category controller'
          require_live https://www.zemzem.al/index.html /tmp/index-all-books.html 'id="allBooksStatic"' 'Homepage all books section'
          require_live https://www.zemzem.al/index.html /tmp/index-all-books.html 'assets/js/home-modern.js' 'Homepage all books script reference'
          require_live https://www.zemzem.al/assets/js/home-modern.js /tmp/home-modern-all-books.js 'renderAllBooksSection' 'Homepage all books renderer'
          require_live https://www.zemzem.al/assets/js/home-modern.js /tmp/home-modern-all-books.js "limit:20" 'Homepage all books default limit'
          require_live https://www.zemzem.al/admin.html /tmp/admin-all-books.html 'siteAllBooksLimit' 'Admin all-books limit control'
