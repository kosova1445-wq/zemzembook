          require_live https://www.zemzem.al/assets/js/admin-branding.js /tmp/admin-branding-mobile.js 'brandMobileLogoFile' 'Editable mobile logo Admin control'
          require_live https://www.zemzem.al/admin.html /tmp/admin-book-meta.html 'bookCountry' 'Admin country metadata field'
          require_live https://www.zemzem.al/admin.html /tmp/admin-book-meta.html 'bookDimensions' 'Admin dimensions metadata field'
          require_live https://www.zemzem.al/admin.html /tmp/admin-book-meta.html 'bookWeight' 'Admin weight metadata field'
