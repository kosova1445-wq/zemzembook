name: Publish eBook Admin on GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'admin-ebooks.html'
      - 'assets/js/admin-ebooks*.js'
      - 'assets/css/admin-ebooks*.css'
      - 'assets/css/ebook-mobile.css'
      - '.github/workflows/pages-ebook-admin.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
