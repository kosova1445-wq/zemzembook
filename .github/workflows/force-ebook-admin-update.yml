name: Force eBook Admin Update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/force-ebook-admin-update.yml'

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FTP_SERVER: quebec.us.hostns.io
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ secrets.FTP_PORT }}
      FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate eBook Admin
        run: |
          node --check assets/js/admin-ebooks.js
          node --check assets/js/admin-ebooks-orders.js
          node --check assets/js/admin-ebooks-pro.js
          node --check assets/js/admin-ebooks-coupons.js
          node --check assets/js/admin-ebooks-commerce.js
      - name: Publish eBook Admin files
        shell: bash
        run: |
          set -euo pipefail
          base="ftp://${FTP_SERVER}:${FTP_PORT}${FTP_SERVER_DIR}"
          case "$base" in */) ;; *) base="$base/";; esac
          upload() {
            f="$1"
            echo "Publishing $f"
            curl --show-error --silent --ssl-reqd --disable-epsv --ftp-skip-pasv-ip --connect-timeout 20 --max-time 40 --user "$FTP_USERNAME:$FTP_PASSWORD" --quote "+DELE $f" "$base" -o /dev/null || true
            curl --fail --show-error --silent --ssl-reqd --disable-epsv --ftp-skip-pasv-ip               --connect-timeout 20 --max-time 60 --retry 2 --retry-delay 2               --user "$FTP_USERNAME:$FTP_PASSWORD" --ftp-create-dirs               --upload-file "$f" "${base}${f}"
          }
          upload assets/js/admin-ebooks.js
          upload assets/js/admin-ebooks-orders.js
          upload assets/js/admin-ebooks-pro.js
          upload assets/js/admin-ebooks-coupons.js
          upload assets/js/admin-ebooks-commerce.js
          upload admin-ebooks.html
      - name: Verify live Admin
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            html="$(curl -fsSL --connect-timeout 10 --max-time 20 "https://www.zemzem.al/admin-ebooks.html?force=${GITHUB_SHA}-$i" || true)"
            if printf '%s' "$html" | grep -Fq 'admin-ebooks-commerce.js'; then
              echo "Professional eBook Admin is live"
              exit 0
            fi
            sleep 4
          done
          exit 1
