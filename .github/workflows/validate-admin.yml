name: Validate ZemZem Frontend

on:
  push:
    branches: [main]
    paths:
      - 'assets/js/**'
      - 'admin*.html'
      - 'account.html'
      - 'ebooks.html'
      - 'ebook.html'
      - 'ebook-checkout.html'
      - '.github/workflows/validate-admin.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for f in assets/js/admin-v2.js assets/js/admin-ebooks-orders.js assets/js/account.js assets/js/ebooks.js assets/js/ebook-checkout.js assets/js/admin-branding.js assets/js/branding.js assets/js/shop-pro.js assets/js/admin-pro-20.js assets/js/storefront-observability.js assets/js/storefront-controls.js; do
            if [ -f "$f" ]; then node --check "$f"; fi
          done
      - name: Check stable frontend hooks
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'store-admin-ops' assets/js/admin-v2.js
          grep -q 'site_content?key=eq.branding' assets/js/branding.js
          grep -q 'brandMenuDesktop' assets/js/admin-branding.js
          grep -q 'shopProPagination' assets/js/shop-pro.js
          grep -q 'admin-branding.js' admin.html
          grep -q 'admin-pro-20.js' admin.html
          grep -q 'storefront-controls.js' checkout.html
          grep -q 'branding.js' shop.html
          echo 'ZEMZEM_FRONTEND_VALIDATION_OK=yes'
