name: Apply Official ZemZem Branding

on:
  workflow_dispatch:

jobs:
  branding:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Inject storefront and Admin branding controls
        shell: bash
        run: |
          set -euo pipefail
          BRAND_TAG='<link rel="stylesheet" href="assets/css/brand.css?v=2">'
          BRAND_SCRIPT='<script src="assets/js/branding.js?v=1" defer></script>'
          for page in \
            index.html shop.html product.html checkout.html paypal-return.html \
            about.html contact.html shipping-returns.html privacy.html terms.html account.html \
            ebooks.html ebook.html ebook-checkout.html ebook-paypal-return.html blog.html article.html; do
            if [ -f "$page" ] && ! grep -Fq 'assets/css/brand.css' "$page"; then
              sed -i "s#</head>#${BRAND_TAG}</head>#" "$page"
            fi
            if [ -f "$page" ] && ! grep -Fq 'assets/js/branding.js' "$page"; then
              sed -i "s#</head>#${BRAND_SCRIPT}</head>#" "$page"
            fi
          done

          HOME_LABELS_JS='<script src="assets/js/home-labels.js?v=2"></script>'
          if [ -f index.html ]; then
            if grep -Fq 'assets/js/home-labels.js' index.html; then
              sed -i 's#assets/js/home-labels.js?v=[0-9]*#assets/js/home-labels.js?v=2#g' index.html
            else
              sed -i "s#</body>#${HOME_LABELS_JS}</body>#" index.html
            fi
          fi

          ADMIN_BRAND_CSS='<link rel="stylesheet" href="assets/css/admin-branding.css?v=1">'
          ADMIN_BRAND_JS='<script src="assets/js/admin-branding.js?v=1"></script>'
          ADMIN_HOME_LABELS_JS='<script src="assets/js/admin-home-labels.js?v=1"></script>'
          if [ -f admin.html ] && ! grep -Fq 'assets/css/admin-branding.css' admin.html; then
            sed -i "s#</head>#${ADMIN_BRAND_CSS}</head>#" admin.html
          fi
          if [ -f admin.html ] && ! grep -Fq 'assets/js/admin-branding.js' admin.html; then
            sed -i "s#</body>#${ADMIN_BRAND_JS}</body>#" admin.html
          fi
          if [ -f admin.html ] && ! grep -Fq 'assets/js/admin-home-labels.js' admin.html; then
            sed -i "s#</body>#${ADMIN_HOME_LABELS_JS}</body>#" admin.html
          fi

      - name: Upload branded public release
        env:
          FTP_SERVER: quebec.us.hostns.io
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          upload() {
            local src="$1"
            curl --fail --show-error --silent \
              --connect-timeout 20 --max-time 60 --retry 2 --retry-delay 2 \
              --ftp-ssl-control --disable-epsv --ftp-skip-pasv-ip --ftp-create-dirs \
              --user "$FTP_USERNAME:$FTP_PASSWORD" \
              --upload-file "$src" \
              "ftp://${FTP_SERVER}:${FTP_PORT}${FTP_SERVER_DIR}${src}"
            echo "Uploaded: $src"
          }

          for file in \
            assets/css/brand.css \
            assets/js/branding.js \
            assets/css/admin-branding.css \
            assets/js/admin-branding.js \
            assets/js/home-labels.js \
            assets/js/admin-home-labels.js \
            assets/brand/zemzem-logo.svg \
            assets/brand/zemzem-watermark.svg \
            favicon.svg \
            index.html shop.html product.html checkout.html paypal-return.html \
            about.html contact.html shipping-returns.html privacy.html terms.html account.html \
            ebooks.html ebook.html ebook-checkout.html ebook-paypal-return.html blog.html article.html \
            admin.html; do
            upload "$file"
          done

      - name: Verify official branding live
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --silent --show-error --max-time 20 "https://www.zemzem.al/assets/css/brand.css?brand=${GITHUB_RUN_ID}" -o /tmp/brand.css
          grep -Fq 'Official ZemZem branding layer' /tmp/brand.css
          grep -Fq -- '--zemzem-logo-width' /tmp/brand.css
          grep -Fq -- '--zemzem-watermark-size' /tmp/brand.css

          curl -L --fail --silent --show-error --max-time 20 "https://www.zemzem.al/assets/js/branding.js?brand=${GITHUB_RUN_ID}" -o /tmp/branding.js
          grep -Fq 'site_content?key=eq.branding' /tmp/branding.js
          grep -Fq 'zemzem:branding-ready' /tmp/branding.js

          curl -L --fail --silent --show-error --max-time 20 "https://www.zemzem.al/assets/js/admin-branding.js?brand=${GITHUB_RUN_ID}" -o /tmp/admin-branding.js
          grep -Fq 'Logo & Brand' /tmp/admin-branding.js
          grep -Fq 'site-branding' /tmp/admin-branding.js

          curl -L --fail --silent --show-error --max-time 20 "https://www.zemzem.al/assets/js/home-labels.js?brand=${GITHUB_RUN_ID}" -o /tmp/home-labels.js
          grep -Fq 'ZemZem Select' /tmp/home-labels.js
          grep -Fq 'site_content?key=eq.home_labels' /tmp/home-labels.js
          ! grep -Fq 'new MutationObserver' /tmp/home-labels.js

          curl -L --fail --silent --show-error --max-time 20 "https://www.zemzem.al/assets/js/admin-home-labels.js?brand=${GITHUB_RUN_ID}" -o /tmp/admin-home-labels.js
          grep -Fq 'Tekstet e dizajnit të Ballinës' /tmp/admin-home-labels.js
          grep -Fq 'Ruaj tekstet e Ballinës' /tmp/admin-home-labels.js

          curl -L --fail --silent --show-error --max-time 20 "https://www.zemzem.al/assets/brand/zemzem-logo.svg?brand=${GITHUB_RUN_ID}" -o /tmp/logo.svg
          grep -Fq 'Shtëpi botuese dhe shpërndarëse' /tmp/logo.svg

          curl -L --fail --silent --show-error --max-time 20 "https://www.zemzem.al/?brand=${GITHUB_RUN_ID}" -o /tmp/index.html
          grep -Fq 'assets/css/brand.css?v=2' /tmp/index.html
          grep -Fq 'assets/js/branding.js?v=1' /tmp/index.html
          grep -Fq 'assets/js/home-labels.js?v=2' /tmp/index.html

          curl -L --fail --silent --show-error --max-time 20 "https://www.zemzem.al/product.html?brand=${GITHUB_RUN_ID}" -o /tmp/product.html
          grep -Fq 'assets/css/brand.css?v=2' /tmp/product.html
          grep -Fq 'assets/js/branding.js?v=1' /tmp/product.html

          curl -L --fail --silent --show-error --max-time 20 "https://www.zemzem.al/ebooks.html?brand=${GITHUB_RUN_ID}" -o /tmp/ebooks.html
          grep -Fq 'assets/css/brand.css?v=2' /tmp/ebooks.html
          grep -Fq 'assets/js/branding.js?v=1' /tmp/ebooks.html

          curl -L --fail --silent --show-error --max-time 20 "https://www.zemzem.al/admin.html?brand=${GITHUB_RUN_ID}" -o /tmp/admin.html
          grep -Fq 'assets/css/admin-branding.css?v=1' /tmp/admin.html
          grep -Fq 'assets/js/admin-branding.js?v=1' /tmp/admin.html
          grep -Fq 'assets/js/admin-home-labels.js?v=1' /tmp/admin.html

          echo 'ZEMZEM_ADMIN_HOME_LABELS_LIVE_OK=yes'
