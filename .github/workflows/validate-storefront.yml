name: Validate Storefront SEO

on:
  push:
    branches: [main]
    paths:
      - 'assets/js/app-v5.js'
      - 'assets/js/checkout-v2.js'
      - 'assets/js/seo-product.js'
      - 'assets/js/seo-ebook.js'
      - 'index.html'
      - 'checkout.html'
      - 'product.html'
      - 'shop.html'
      - 'ebooks.html'
      - 'ebook.html'
      - 'about.html'
      - 'contact.html'
      - 'shipping-returns.html'
      - 'robots.txt'
      - 'sitemap.xml'
      - '.github/workflows/validate-storefront.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check assets/js/app-v5.js
          node --check assets/js/checkout-v2.js
          node --check assets/js/seo-product.js
          node --check assets/js/seo-ebook.js
      - name: Check SEO metadata and sitemap
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Sitemap: https://www.zemzem.al/sitemap.xml' robots.txt
          grep -q 'application/ld+json' index.html
          grep -q 'application/ld+json' shop.html
          grep -q 'application/ld+json' ebooks.html
          grep -q 'seo-product.js' product.html
          grep -q 'seo-ebook.js' ebook.html
          test -s sitemap.xml
          echo 'ZEMZEM_STOREFRONT_SEO_VALIDATION_OK=yes'
