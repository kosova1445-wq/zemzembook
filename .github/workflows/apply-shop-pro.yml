name: Apply Professional Shop

on:
  workflow_run:
    workflows: ["Deploy ZemZem to cPanel"]
    types: [completed]
    branches: [main]

concurrency:
  group: zemzem-professional-shop
  cancel-in-progress: true

jobs:
  shop:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Upload professional shop assets
        env:
          FTP_SERVER: quebec.us.hostns.io
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          upload() {
            local src="$1"
            curl --fail --show-error --silent \
              --connect-timeout 20 --max-time 60 --retry 2 --retry-delay 2 \
              --ftp-ssl-control --disable-epsv --ftp-skip-pasv-ip --ftp-create-dirs \
              --user "$FTP_USERNAME:$FTP_PASSWORD" \
              --upload-file "$src" \
              "ftp://${FTP_SERVER}:${FTP_PORT}${FTP_SERVER_DIR}${src}"
            echo "Uploaded: $src"
          }
          upload assets/css/shop-pro.css
          upload assets/js/shop-pro.js

      - name: Verify professional shop live
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --silent --show-error --max-time 20 "https://www.zemzem.al/assets/css/shop-pro.css?shop=${GITHUB_RUN_ID}" -o /tmp/shop-pro.css
          grep -Fq 'ZemZem Professional Shop' /tmp/shop-pro.css
          grep -Fq '.shop-pro-pagination' /tmp/shop-pro.css
          curl -L --fail --silent --show-error --max-time 20 "https://www.zemzem.al/assets/js/shop-pro.js?shop=${GITHUB_RUN_ID}" -o /tmp/shop-pro.js
          grep -Fq 'Më të shiturit' /tmp/shop-pro.js
          grep -Fq 'shopProPagination' /tmp/shop-pro.js
          curl -L --fail --silent --show-error --max-time 20 "https://www.zemzem.al/shop.html?shop=${GITHUB_RUN_ID}" -o /tmp/shop.html
          grep -Fq 'assets/css/shop-pro.css?v=1' /tmp/shop.html
          grep -Fq 'assets/js/shop-pro.js?v=1' /tmp/shop.html
          echo 'ZEMZEM_PRO_SHOP_LIVE_OK=yes'
