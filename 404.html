<!doctype html>
<html lang="sq">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>Faqja nuk u gjet — ZemZem</title>
  <meta name="description" content="Faqja që kërkove nuk u gjet. Kthehu te ZemZem.al.">
  <link rel="icon" href="favicon.svg">
  <link rel="stylesheet" href="assets/css/style.css?v=1">
  <link rel="stylesheet" href="assets/css/brand.css?v=9">
  <style>
    body{margin:0;background:#f7faf8;color:#1d2d36}.zz404{min-height:100vh;display:grid;place-items:center;padding:28px}
    .zz404-card{width:min(760px,100%);background:#fff;border:1px solid #dde7e2;border-radius:26px;padding:42px;box-shadow:0 24px 70px rgba(28,61,49,.10);text-align:center}
    .zz404-code{font-size:clamp(72px,18vw,150px);line-height:.9;font-weight:950;letter-spacing:-.06em;color:#28745d}
    .zz404 h1{font-size:clamp(28px,5vw,44px);margin:18px 0 10px}.zz404 p{color:#66767b;font-size:17px;line-height:1.65;max-width:600px;margin:0 auto 24px}
    .zz404-search{display:flex;gap:8px;max-width:560px;margin:0 auto 18px}.zz404-search input{flex:1;min-height:46px;border:1px solid #d9e3de;border-radius:11px;padding:11px 12px;font:inherit}.zz404-search button{border:0;border-radius:11px;background:#28745d;color:#fff;padding:0 18px;font-weight:900;cursor:pointer}
    .zz404-actions,.zz404-links{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.zz404-actions a{display:inline-flex;align-items:center;justify-content:center;padding:12px 17px;border-radius:12px;text-decoration:none;font-weight:900}
    .zz404-primary{background:#28745d;color:#fff}.zz404-secondary{background:#f2f6f4;color:#263b34;border:1px solid #dce6e1}.zz404-links{margin-top:22px;font-size:13px}.zz404-links a{color:#52665d}
    @media(max-width:560px){.zz404-card{padding:30px 18px}.zz404-search{flex-direction:column}.zz404-search button{min-height:44px}}
  </style>
</head>
<body>
  <main class="zz404">
    <section class="zz404-card" aria-labelledby="zz404-title">
      <div class="zz404-code">404</div>
      <h1 id="zz404-title">Faqja nuk u gjet</h1>
      <p>Linku mund të jetë ndryshuar ose faqja nuk ekziston më. Kërko një libër ose vazhdo te një nga seksionet kryesore të ZemZem-it.</p>
      <form class="zz404-search" action="shop.html">
        <input name="q" aria-label="Kërko libër" placeholder="Kërko titull, autor ose ISBN...">
        <button type="submit">Kërko</button>
      </form>
      <div class="zz404-actions">
        <a class="zz404-primary" href="index.html">Kthehu në Ballinë</a>
        <a class="zz404-secondary" href="shop.html">Shiko librat</a>
      </div>
      <div class="zz404-links">
        <a href="ebooks.html">eBook</a>
        <a href="free-library.html">Biblioteka Falas</a>
        <a href="tracking.html">Gjurmo porosinë</a>
        <a href="contact.html">Kontakt</a>
      </div>
    </section>
  </main>
  <script src="assets/js/branding.js?v=9"></script>
</body>
</html>
